<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!--
      These static tags are what crawlers and link previews see BEFORE React
      runs — including Meta's reviewer tooling during business verification.
      react-helmet-async overrides them per route once the app mounts, but the
      static values must still be correct on their own.
    -->
    <title>Sree Mohan Agri Mall | Quality Agricultural Products for Indian Farmers</title>
    <meta
      name="description"
      content="Sree Mohan Agri Mall supplies seeds, crop protection, plant nutrition and farm equipment to farmers across Andhra Pradesh, Telangana and Karnataka, backed by Jyothir Agri Science and 16/7 agronomy support."
    />
    <meta name="author" content="Sree Mohan Agri Mall" />
    <link rel="canonical" href="https://agrimall.io/" />

    <meta property="og:site_name" content="Sree Mohan Agri Mall" />
    <meta property="og:title" content="Sree Mohan Agri Mall | Quality Agricultural Products" />
    <meta
      property="og:description"
      content="Premium agricultural products with a solution-based approach, backed by Jyothir Agri Science quality."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agrimall.io/" />
    <meta property="og:image" content="https://agrimall.io/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sree Mohan Agri Mall | Quality Agricultural Products" />
    <meta
      name="twitter:description"
      content="Premium agricultural products with a solution-based approach, backed by Jyothir Agri Science quality."
    />
    <meta name="twitter:image" content="https://agrimall.io/logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
